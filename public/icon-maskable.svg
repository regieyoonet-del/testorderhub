<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full bleed background for Android maskable safe-zone -->
  <rect width="512" height="512" fill="#09090b"/>
  
  <!-- ARH Monogram positioned within center 75% safe-zone -->
  <g transform="translate(0, -10)">
    <text x="256" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="130" font-weight="900" letter-spacing="-3" fill="#ffffff" text-anchor="middle">ARH</text>
    <text x="256" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="7" fill="#a1a1aa" text-anchor="middle">PRINT HUB</text>
  </g>

  <!-- CMYK Accent Bar -->
  <g transform="translate(176, 360)">
    <circle cx="20" cy="10" r="7" fill="#00e5ff"/>
    <circle cx="60" cy="10" r="7" fill="#ff007f"/>
    <circle cx="100" cy="10" r="7" fill="#ffea00"/>
    <circle cx="140" cy="10" r="7" fill="#ffffff"/>
  </g>
</svg>
