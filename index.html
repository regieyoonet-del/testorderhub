<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" id="dynamic-favicon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" id="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" id="manifest-link" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ARH Hub" />
    <meta name="application-name" content="ARH Hub" />
    <title>ARH Print Hub</title>
    <meta name="description" content="Minimal B2B ordering hub for company uniforms, IDs, business cards, and promo products, featuring Job Management & Production Board, biometric DTR attendance & payroll review, Google Sheets synchronization, monthly Financial Overview with target profit margin quota tracking, and Management Sales Goals with annual & quarterly pacing analytics." />
    <script>
      // Early PWA installation listener and Service Worker registration
      window.__pwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__pwaPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__pwaPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });

      // Global runtime error logger
      window.addEventListener('error', function (e) {
        console.error('[Hub Error]', e.error || e.message);
      });
      window.addEventListener('unhandledrejection', function (e) {
        console.error('[Hub Unhandled Rejection]', e.reason);
      });

      // In development or preview iframe (AI Studio), unregister service workers to avoid stale caching
      var isIframeOrDev = window.self !== window.top ||
        window.location.hostname.includes('run.app') ||
        window.location.hostname === 'localhost';

      if ('serviceWorker' in navigator) {
        if (isIframeOrDev) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
          if ('caches' in window) {
            caches.keys().then(function (names) {
              for (var j = 0; j < names.length; j++) {
                if (names[j].includes('shell') || names[j].includes('pwa')) {
                  caches.delete(names[j]);
                }
              }
            });
          }
        } else {
          var registerSW = function () {
            navigator.serviceWorker.register('/sw.js', { scope: '/' })
              .then(function (reg) {
                reg.update();
              })
              .catch(function (err) {
                console.warn('[PWA] SW register notice:', err);
              });
          };

          if (document.readyState === 'complete') {
            registerSW();
          } else {
            window.addEventListener('load', registerSW);
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
